name: Build Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build APK and embeddable AAR
        run: ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar" BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0" scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bo-v0.1.0-development
          path: |
            build/Bo-v0.1.0.apk
            build/bo-core-0.1.0.aar
  reader-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/reader.test.cjs
